name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          Z=$(find . -name "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$Z" ]; then echo "لا يوجد ملف zip في المستودع"; ls -la; exit 1; fi
          echo "وجدت: $Z"
          unzip -q "$Z" -d /tmp/x
          rm "$Z"
          SRC=$(find /tmp/x -maxdepth 2 -name package.json -printf '%h\n' | head -n 1)
          rm -rf "$SRC/.github"
          cp -r "$SRC"/. .
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract project"
          git push
